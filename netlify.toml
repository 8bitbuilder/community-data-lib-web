[build]
  command = "rm -rf .backend-canonical && git clone --depth 1 https://github.com/community-data-libraries/backend.git .backend-canonical && BACKEND_ROOT=.backend-canonical npm run build"
  publish = "dist"
  functions = "netlify/functions"

# ── Form submission webhook ──────────────────────────────────────────────────
# Triggers the submission-notify function whenever a new form submission
# arrives from the "resource-submission" Netlify Form.
[[plugins]]
  package = "@netlify/plugin-functions-install-core"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/"
  to = "/web/"
  status = 302

# Netlify ignores trailing slashes when matching rules, so a "/web" -> "/web/"
# redirect also matches "/web/" and loops forever (the broken Home link).
# "/web/*" already covers both "/web" and "/web/" (they rewrite to "/").
[[redirects]]
  from = "/web/*"
  to = "/:splat"
  status = 200
