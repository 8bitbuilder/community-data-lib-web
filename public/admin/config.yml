backend:
  name: git-gateway
  branch: main

local_backend: true

media_folder: public/uploads
public_folder: /web/uploads

# Decap manages community configuration only. Datasets and their metadata
# come from the backend pipeline (see scripts/sync-catalog-from-backend.mjs);
# community libraries are filtered views of that catalog, so there is no
# dataset collection here.
collections:
  - name: communities
    label: Communities
    label_singular: Community
    folder: src/content/communities
    create: true
    slug: '{{slug}}'
    extension: md
    format: frontmatter
    fields:
      - label: Library Name
        name: name
        widget: string
        required: true
        hint: 'Full library name shown in listings, e.g. "Knox County Data Library".'
      - label: Place Name
        name: place_name
        widget: string
        required: false
        hint: 'Short place name used in "Welcome to ..." and "... Community Data Library", e.g. "Knoxville". Defaults to the library name.'
      - label: Slug
        name: slug
        widget: string
        required: true
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', 'Must be URL-safe (lowercase letters, numbers, and hyphens)']
      - { label: Description, name: description, widget: text, required: false }
      - label: State Code
        name: state_code
        widget: select
        required: true
        options:
          - AL
          - AK
          - AZ
          - AR
          - CA
          - CO
          - CT
          - DE
          - DC
          - FL
          - GA
          - HI
          - ID
          - IL
          - IN
          - IA
          - KS
          - KY
          - LA
          - ME
          - MD
          - MA
          - MI
          - MN
          - MS
          - MO
          - MT
          - NE
          - NV
          - NH
          - NJ
          - NM
          - NY
          - NC
          - ND
          - OH
          - OK
          - OR
          - PA
          - RI
          - SC
          - SD
          - TN
          - TX
          - UT
          - VT
          - VA
          - WA
          - WV
          - WI
          - WY
      - { label: County, name: county, widget: string, required: false }
      - label: County FIPS
        name: county_fips
        widget: string
        required: false
        hint: 'Five-digit county FIPS code (state + county), e.g. 47093 for Knox County, TN. This is the main filter for your community catalog.'
        pattern: ['^[0-9]{5}$', 'Must be a 5-digit FIPS code']
      - label: ZIP Codes
        name: zip_codes
        widget: list
        required: false
        field:
          label: ZIP Code
          name: zip_code
          widget: string
          pattern: ['^[0-9]{5}$', 'Must be a 5-digit ZIP code']
